  body::after{
    content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:
      radial-gradient(115% 85% at 50% 46%, rgba(252,246,232,.10), rgba(223,205,168,.62) 74%),
      linear-gradient(rgba(248,240,222,.22), rgba(226,209,172,.40));
  }

  /* --- Шапка --- */
  header{text-align:center; width:100%}
  h1{
    margin:0;
    font-family:var(--display); font-weight:700;
    font-size:clamp(1rem, 4.6vw, 1.35rem);
    letter-spacing:.5em; text-indent:.5em;
    color:var(--ink);
  }
  .rule{
    width:min(46vw,190px); height:1px; margin:11px auto 9px;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);
  }
  .sub{
    margin:0;
    font-style:italic; font-weight:500;
    font-size:clamp(.9rem, 3.8vw, 1.06rem);
    letter-spacing:.06em; color:var(--ink-soft);
  }

  main{width:100%; display:flex; flex-direction:column; align-items:center; gap:14px}

  /* --- Счётчик --- */
  .meter{width:min(90vw,460px); display:flex; align-items:center; gap:12px}
  .count{
    font-family:var(--display); font-weight:400;
    font-size:.8rem; letter-spacing:.1em; color:var(--ink); white-space:nowrap;
  }
  .count b{color:#7A5A22; font-weight:700}
  .track{flex:1; height:1px; background:rgba(58,46,34,.28); position:relative}
  .track i{
    position:absolute; inset:0 auto 0 0; display:block;
    background:linear-gradient(90deg,var(--gold),#7A5A22);
    transition:width .35s cubic-bezier(.4,0,.2,1);
  }
  .shuffled{
    font-family:var(--body); font-style:italic;
    font-size:.82rem; letter-spacing:.06em; color:#7A5A22;
    opacity:0; transition:opacity .3s; white-space:nowrap;
  }
  .shuffled.on{opacity:.95}

  /* --- Карточка --- */
  .scene{
    width:min(90vw,460px);
    height:clamp(250px, 44vh, 340px);
    perspective:1500px;
    touch-action:pan-y;
  }
  .card{
    position:relative; width:100%; height:100%;
    transform-style:preserve-3d;
    transition:transform 1.1s cubic-bezier(.32,.72,.28,1);
    cursor:pointer;
  }
  .card.flipped{transform:rotateY(180deg)}
  .card:focus-visible{outline:2px solid var(--gold); outline-offset:12px}

  .face{
    position:absolute; inset:0; overflow:hidden;
    backface-visibility:hidden; -webkit-backface-visibility:hidden;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:36px 30px; border-radius:16px;
    /* подстраховка от просвечивания: сторона гаснет ровно на середине поворота */
    opacity:1; transition:opacity 0s linear .55s;
  }
  .back{opacity:0}
  .card.flipped .front{opacity:0}
  .card.flipped .back{opacity:1}
  .front{
    transform:rotateY(0deg) translateZ(1px);
    background:linear-gradient(158deg,#FDF8EC 0%, #F6EAD1 55%, #EADBB8 100%);
    border:1px solid rgba(58,46,34,.42);
    box-shadow:inset 0 0 0 5px #FBF4E3, inset 0 0 0 6px rgba(168,130,63,.55),
               inset 0 0 40px rgba(140,110,64,.14), 0 20px 46px rgba(60,44,24,.32);
    color:var(--ink);
  }
  .back{
    transform:rotateY(180deg) translateZ(1px);
    background:linear-gradient(158deg,#40321F 0%, #2C2216 58%, #1E1710 100%);
    border:1px solid #1A130C;
    box-shadow:inset 0 0 0 5px #2C2216, inset 0 0 0 6px rgba(207,174,114,.5),
               0 20px 46px rgba(30,20,10,.45);
    color:#F3E6C8;
  }
  /* мягкие ромбы-ориентиры вместо угловых скобок */
  .face::before, .face::after{
    content:""; position:absolute; left:50%;
    width:7px; height:7px; margin-left:-3.5px;
    background:var(--gold); opacity:.6;
    transform:rotate(45deg); border-radius:1.5px;
  }
  .face::before{top:18px}
  .face::after{bottom:18px}
  .back::before, .back::after{background:var(--gold-l); opacity:.5}

  .term{
    position:relative; z-index:1;
    font-size:clamp(1.3rem, 6vw, 1.95rem);
    font-weight:500; line-height:1.28; letter-spacing:.005em;
    max-width:22ch;
  }
  .term.m{font-size:clamp(1.1rem, 4.9vw, 1.5rem); max-width:26ch}
  .term.s{font-size:clamp(.95rem, 3.9vw, 1.16rem); line-height:1.4; max-width:32ch}
  .note{
    position:relative; z-index:1;
    margin-top:.7em;
    font-size:clamp(.85rem, 3.3vw, 1rem);
    font-style:italic; line-height:1.36;
    color:var(--ink-soft); max-width:30ch;
  }
  .back .note{color:rgba(243,230,200,.66)}

  .word{
    position:relative; z-index:1;
    font-family:var(--display); font-weight:700;
    font-size:clamp(1.2rem, 5.8vw, 1.85rem);
    line-height:1.2; letter-spacing:.05em;
    max-width:15ch;
  }
  .word.m{font-size:clamp(1rem, 4.6vw, 1.42rem); max-width:18ch}
  .word.s{font-size:clamp(.82rem, 3.6vw, 1.06rem); letter-spacing:.03em; max-width:22ch}
  .ipa{
    position:relative; z-index:1;
    margin-top:.75em;
    font-family:var(--ipa);
    font-size:clamp(.82rem, 3.4vw, 1rem);
    color:rgba(243,230,200,.62);
  }
  .ex{
    position:relative; z-index:1;
    margin-top:.8em;
    font-family:var(--body); font-style:italic; font-weight:600;
    font-size:clamp(.95rem, 4vw, 1.18rem);
    color:var(--gold-l);
  }

  .hint{
    font-style:italic; font-size:.9rem; letter-spacing:.04em;
    color:var(--ink-soft); opacity:.85; transition:opacity .3s;
  }
  .hint.gone{opacity:0}

  /* --- Управление --- */
  nav{width:min(90vw,460px); display:grid; grid-template-columns:1fr 1.2fr 1fr; gap:10px}
  button{
    appearance:none; cursor:pointer;
    min-height:52px; padding:0 10px; border-radius:999px;
    background:rgba(251,244,227,.78);
    border:1px solid rgba(58,46,34,.42);
    color:var(--ink);
    font-family:var(--display); font-weight:400;
    font-size:.68rem; letter-spacing:.2em; text-transform:uppercase;
    transition:background .2s, border-color .2s, color .2s, transform .12s;
  }
  button:hover{background:#FDF8EC; border-color:var(--gold); color:#7A5A22}
  button:active{transform:translateY(1px)}
  button:focus-visible{outline:2px solid var(--gold); outline-offset:3px}
  #shuffle{
    background:linear-gradient(#4A3922,#2C2216);
    border-color:#241B12; color:#F0E2C1;
  }
  #shuffle:hover{background:linear-gradient(#5C4728,#382B1B); color:#FBF4E3}

  .reset{
    margin-top:2px; min-height:auto;
    background:none; border:none; padding:8px;
    font-family:var(--body); font-style:italic; font-size:.9rem;
    letter-spacing:.03em; text-transform:none;
    color:var(--ink-soft); text-decoration:underline; text-underline-offset:4px;
  }
  .reset:hover{background:none; color:var(--ink); border-color:transparent}

  footer{
    font-family:var(--display); font-size:.6rem;
    letter-spacing:.2em; color:rgba(58,46,34,.55); text-align:center;
  }


  /* --- полный список слов --- */
  .list-link{margin-bottom:2px}
  .list-overlay{
    position:fixed; inset:0; z-index:20;
    display:flex; align-items:center; justify-content:center;
    padding:20px 14px;
    background:rgba(46,36,24,.55);
    -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px);
  }
  .list-overlay[hidden]{display:none}
  .list-panel{
    width:min(94vw,560px); max-height:86dvh;
    display:flex; flex-direction:column;
    background:linear-gradient(158deg,#FDF8EC 0%, #F6EAD1 60%, #EEDFBE 100%);
    border:1px solid rgba(58,46,34,.42);
    border-radius:18px;
    box-shadow:inset 0 0 0 5px #FBF4E3, inset 0 0 0 6px rgba(168,130,63,.55),
               0 26px 60px rgba(40,28,14,.45);
    overflow:hidden;
  }
  .list-head{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:22px 26px 14px;
  }
  .list-head h2{
    margin:0; font-family:var(--display); font-weight:700;
    font-size:clamp(.8rem,3.6vw,1rem); letter-spacing:.16em; color:var(--ink);
  }
  .list-close{
    min-height:38px; padding:0 18px; flex:none;
    font-size:.62rem; letter-spacing:.18em;
  }
  .list-body{
    margin:0; padding:0 14px 22px; list-style:none;
    overflow-y:auto; -webkit-overflow-scrolling:touch;
    counter-reset:w;
  }
  .list-body li{
    counter-increment:w;
    display:grid; grid-template-columns:2.4em 1fr; column-gap:6px;
    padding:11px 12px; border-radius:16px;
    border-bottom:1px solid rgba(58,46,34,.14);
    cursor:pointer;
  }
  .list-body li:last-child{border-bottom:0}
  .list-body li:hover{background:rgba(168,130,63,.13)}
  .list-body li::before{
    content:counter(w) ".";
    font-style:italic; color:#8A6A32; font-size:1rem; padding-top:.1em;
  }
  .li-ru{font-style:italic; font-size:1.05rem; line-height:1.32; color:var(--ink)}
  .li-en{
    display:block; margin-top:.18em;
    font-family:var(--body); font-size:1rem; line-height:1.34;
    color:var(--ink-soft);
  }
  .li-ipa{font-family:var(--ipa); font-size:.82em}

  @media (max-height:660px){
    .scene{height:clamp(200px, 38vh, 260px)}
    .hint{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    .card{transition:none}
    .face{transition-delay:0s}
    .track i{transition:none}
  }
</style>
</head>
<body>
<header>
  <h1>UNIT 1</h1>
  <div class="rule"></div>
  <p class="sub">Make the grade · 83 words</p>
</header>

<main>
  <div class="meter">
    <span class="count"><b id="pos">1</b> / <span id="total">83</span></span>
    <span class="track"><i id="bar" style="width:1.2%"></i></span>
    <span class="shuffled" id="shuffledTag">shuffled</span>
  </div>

  <div class="scene">
    <div class="card" id="card" role="button" tabindex="0" aria-label="Карточка. Нажмите, чтобы перевернуть">
      <div class="face front">
        <div class="term" id="ru"></div>
        <div class="note" id="ruNote"></div>
      </div>
      <div class="face back">
        <div class="word" id="en"></div>
        <div class="ipa" id="ipa"></div>
        <div class="ex" id="ex"></div>
      </div>
    </div>
  </div>

  <p class="hint" id="hint">tap the card to flip · swipe to move on</p>

  <button class="reset list-link" id="listOpen" type="button">The entire word list</button>

  <nav>
    <button id="prev" type="button">back</button>
    <button id="shuffle" type="button">shuffle</button>
    <button id="next" type="button">forward</button>
  </nav>
  <button class="reset" id="reset" type="button">reset the original order</button>
</main>

<div class="list-overlay" id="listOverlay" hidden>
  <div class="list-panel" role="dialog" aria-modal="true" aria-label="The entire word list">
    <div class="list-head">
      <h2>THE ENTIRE WORD LIST</h2>
      <button class="list-close" id="listClose" type="button">close</button>
    </div>
    <ol class="list-body" id="listBody"></ol>
  </div>
</div>

<footer>← → browse · space to flip</footer>

<script>
const DATA = [
 {ru:"за границей; за границу", rn:"путешествовать за границей", en:"abroad", ipa:"[ə´brɔ:d]", ex:"to go abroad"},
 {ru:"помощь вуза или школы в адаптации студента, выборе предметов и планировании карьеры; помощь в обучении", en:"academic support"},
 {ru:"назначить встречу", en:"make an appointment"},
 {ru:"оценка", rn:"(состояния, результатов)", en:"assessment", ipa:"[ə´sesmənt]"},
 {ru:"выполнять задание", en:"do an assignment", ipa:"[ə´saɪnmənt]"},
 {ru:"посещать; присутствовать", rn:"(на лекциях, собраниях)", en:"attend", ipa:"[ə´tend]"},
 {ru:"выгодный, полезный", en:"beneficial", ipa:"[ˏbenɪ´fɪʃl]"},
 {ru:"делать всё возможное", rn:"приложить все усилия", en:"do your best"},
 {ru:"перекусить", rn:"«заморить червячка»", en:"have a bite to eat"},
 {ru:"перерыв, пауза; перемена (в школе)", en:"break", ipa:"[breɪk]"},
 {ru:"заниматься бизнесом", en:"do business"},
 {ru:"печь пирог", en:"make a cake"},
 {ru:"кампус, территория университета, колледжа", en:"campus", ipa:"[´kæmpəs]"},
 {ru:"делать выбор", en:"make a choice"},
 {ru:"выполнять повседневную работу по дому", en:"do chores"},
 {ru:"шахматный клуб", en:"chess club", ipa:"[tʃes klʌb]"},
 {ru:"«накопительная оценка»", rn:"система регулярного контроля успеваемости (тесты, курсовые, посещаемость), а не оценка по итогам одного финального экзамена", en:"continuous assignment", ipa:"[kən´tɪnjʊəs ə´saɪnmənt]"},
 {ru:"проходить обучение", en:"do a course"},
 {ru:"стоить; иметь значение", en:"count for"},
 {ru:"курсовая работа", en:"coursework", ipa:"[kɔ:s wɜ:k]"},
 {ru:"текущие события", en:"current affairs", ipa:"[´kʌrənt ə´feəz]"},
 {ru:"иметь дело с кем/чем-либо", en:"deal with"},
 {ru:"принимать решение", en:"make a decision"},
 {ru:"степень / диплом / образование", rn:"получать образование", en:"degree", ipa:"[dɪ´ɡri:]", ex:"do a degree"},
 {ru:"приготовить обед", en:"make the dinner"},
 {ru:"попытаться; приложить усилия", en:"make an effort", ipa:"[´efət]"},
 {ru:"чувство; эмоция", en:"emotion", ipa:"[ɪ´məʊʃn]"},
 {ru:"написать эссе", en:"do an essay"},
 {ru:"сдавать экзамен", en:"do an exam"},
 {ru:"оправдываться", rn:"найти отговорку", en:"make an excuse"},
 {ru:"внеклассные / внеурочные занятия", en:"extracurricular activities"},
 {ru:"оборудование; приспособления; аппаратура", en:"facilities", ipa:"[fə´sɪlətɪz]"},
 {ru:"сделать одолжение", rn:"оказать услугу", en:"do a favour", ipa:"[´feɪvə]"},
 {ru:"заводить друзей", en:"make friends"},
 {ru:"амер. отметка, оценка", rn:"амер. класс (в школе)", en:"grade", ipa:"[ɡreɪd]"},
 {ru:"причесаться", rn:"привести волосы в порядок", en:"do one's hair"},
 {ru:"высшее образование", en:"higher education"},
 {ru:"выполнять домашнее задание", en:"do one's homework"},
 {ru:"вводная / ознакомительная неделя", en:"induction week", ipa:"[ɪn´dʌkʃn]"},
 {ru:"собеседование при приёме на работу / учёбу", en:"interview", ipa:"[´ɪntəvju:]"},
 {ru:"побег из тюрьмы", en:"jailbreak", ipa:"[´dʒeɪlbreɪk]"},
 {ru:"лекция", en:"lecture", ipa:"[´lektʃə]"},
 {ru:"лекционный зал", en:"lecture hall"},
 {ru:"лектор, преподаватель", rn:"(университета, колледжа)", en:"lecturer", ipa:"[´lektʃərə]"},
 {ru:"балл", rn:"оценка (знаний)", en:"mark", ipa:"[mɑ:k]"},
 {ru:"упустить (шанс)", rn:"отказываться от", en:"miss out on"},
 {ru:"совершить ошибку", en:"make a mistake"},
 {ru:"зарабатывать деньги", en:"make money"},
 {ru:"шуметь", rn:"выражать недовольство", en:"make a noise"},
 {ru:"записывать, конспектировать", en:"take notes"},
 {ru:"роман", en:"novel", ipa:"[´nɒvəl]"},
 {ru:"делать предложение", rn:"внести предложение", en:"make an offer"},
 {ru:"личный наставник", en:"personal tutor", ipa:"[´tju:tə]"},
 {ru:"совершить звонок", en:"make a phone call"},
 {ru:"замысел, намерение", en:"plan", ipa:"[plæn]"},
 {ru:"аспирант", en:"postgraduate", ipa:"[ˏpəʊst´ɡrædʒʊət]"},
 {ru:"добиваться успехов", en:"make progress"},
 {ru:"пообещать", en:"make a promise"},
 {ru:"думать, предполагать, придерживаться мнения", en:"reckon", ipa:"[´rekən]"},
 {ru:"отвечать", en:"reply", ipa:"[rɪ´plaɪ]"},
 {ru:"возможность, способ, средство", rn:"(обыкн. pl)", en:"resource", ipa:"[rɪ´zɔ:s]"},
 {ru:"ролевая игра", en:"role-play"},
 {ru:"стипендия", en:"scholarship", ipa:"[´skɒləʃɪp]"},
 {ru:"здравомыслящий", en:"sensible", ipa:"[´sensəbl]"},
 {ru:"закупаться", en:"do the shopping"},
 {ru:"студенческое общество", en:"students' society"},
 {ru:"первопричина, источник", en:"source", ipa:"[sɔ:s]"},
 {ru:"ораторское выступление, речь", en:"speech", ipa:"[spi:tʃ]"},
 {ru:"заниматься спортом", en:"do the sport"},
 {ru:"штат сотрудников", en:"staff", ipa:"[stɑ:f]"},
 {ru:"жильё для студентов; общежитие", en:"student accommodation"},
 {ru:"финансовая помощь студентам", en:"student finance", ipa:"[´faɪnæns]"},
 {ru:"студенческий кредит", en:"student loan", ipa:"[ləʊn]"},
 {ru:"предмет (в школе / университете)", rn:"предмет для обсуждения", en:"subject", ipa:"[´sʌbdʒekt]"},
 {ru:"вносить предложение", en:"make a suggestion"},
 {ru:"по очереди, чередоваться", en:"take it in turns"},
 {ru:"отвлечься от проблем", rn:"переключиться", en:"take one's mind off"},
 {ru:"семестр", rn:"(половина учебного года)", en:"term", ipa:"[tɜ:m]"},
 {ru:"расписание", en:"timetable", ipa:"[´taɪmˏteɪbl]"},
 {ru:"учебное / обучающее пособие / фильм", en:"tutorial", ipa:"[tjʊ´tɔ:rɪəl]"},
 {ru:"студент в процессе обучения", rn:"(ещё не получивший диплом об окончании)", en:"undergraduate", ipa:"[ˏʌndə´ɡrædʒʊət]"},
 {ru:"стирать бельё", en:"do the wash / do the washing-up"},
 {ru:"преуспеть, добиться успеха", en:"do well"}
];

const card = document.getElementById('card');

const ruEl = document.getElementById('ru');
const ruNoteEl = document.getElementById('ruNote');
const enEl = document.getElementById('en');
const ipaEl = document.getElementById('ipa');
const exEl = document.getElementById('ex');
const posEl = document.getElementById('pos');
const totalEl = document.getElementById('total');
const barEl = document.getElementById('bar');
const hintEl = document.getElementById('hint');
const tagEl = document.getElementById('shuffledTag');

let order = DATA.map((_, i) => i);
let idx = 0;
let flipped = false;
let touched = false;

totalEl.textContent = DATA.length;

function sizeClass(text, big, mid){
  const n = text.length;
  if (n <= big) return '';
  if (n <= mid) return 'm';
  return 's';
}

function render(){
  const c = DATA[order[idx]];
  ruEl.textContent = c.ru;
  ruEl.className = 'term ' + sizeClass(c.ru, 26, 60);
  ruNoteEl.textContent = c.rn || '';
  ruNoteEl.style.display = c.rn ? 'block' : 'none';

  enEl.textContent = c.en;
  enEl.className = 'word ' + sizeClass(c.en, 13, 20);
  ipaEl.textContent = c.ipa || '';
  ipaEl.style.display = c.ipa ? 'block' : 'none';
  exEl.textContent = c.ex || '';
  exEl.style.display = c.ex ? 'block' : 'none';

  posEl.textContent = idx + 1;
  barEl.style.width = ((idx + 1) / DATA.length * 100) + '%';
}

function setFlip(state){
  flipped = state;
  card.classList.toggle('flipped', flipped);
  if (flipped && !touched){ touched = true; hintEl.classList.add('gone'); }
}

function go(step){
  const wasFlipped = flipped;
  setFlip(false);
  idx = (idx + step + DATA.length) % DATA.length;
  setTimeout(render, wasFlipped ? 570 : 0);
}

card.addEventListener('click', () => setFlip(!flipped));
card.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); setFlip(!flipped); }
});

document.getElementById('next').addEventListener('click', () => go(1));
document.getElementById('prev').addEventListener('click', () => go(-1));

document.getElementById('shuffle').addEventListener('click', () => {
  for (let i = order.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  idx = 0;
  setFlip(false);
  tagEl.classList.add('on');
  setTimeout(render, 60);
});

document.getElementById('reset').addEventListener('click', () => {
  order = DATA.map((_, i) => i);
  idx = 0;
  setFlip(false);
  tagEl.classList.remove('on');
  setTimeout(render, 60);
});

document.addEventListener('keydown', e => {
  if (!document.getElementById('listOverlay').hidden) return;
  if (e.key === 'ArrowRight'){ go(1); }
  else if (e.key === 'ArrowLeft'){ go(-1); }
  else if (e.key === ' ' && e.target === document.body){ e.preventDefault(); setFlip(!flipped); }
});

// свайпы
let sx = 0, sy = 0, swiping = false;
const scene = document.querySelector('.scene');
scene.addEventListener('touchstart', e => {
  sx = e.touches[0].clientX; sy = e.touches[0].clientY; swiping = false;
}, {passive:true});
scene.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - sx;
  const dy = e.changedTouches[0].clientY - sy;
  if (Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy)){
    swiping = true;
    go(dx < 0 ? 1 : -1);
  }
}, {passive:true});
card.addEventListener('click', e => { if (swiping){ e.stopPropagation(); swiping = false; } }, true);

/* --- полный список из 83 слов --- */
const listOverlay = document.getElementById('listOverlay');
const listBody = document.getElementById('listBody');

DATA.forEach((c, i) => {
  const li = document.createElement('li');
  li.dataset.i = i;
  const ru = document.createElement('span');
  ru.className = 'li-ru';
  ru.textContent = c.rn ? c.ru + ' — ' + c.rn : c.ru;
  const en = document.createElement('span');
  en.className = 'li-en';
  en.textContent = c.en + (c.ex ? ' · ' + c.ex : '');
  if (c.ipa){
    const ipa = document.createElement('span');
    ipa.className = 'li-ipa';
    ipa.textContent = ' ' + c.ipa;
    en.appendChild(ipa);
  }
  const wrap = document.createElement('span');
  wrap.appendChild(ru); wrap.appendChild(en);
  li.appendChild(wrap);
  listBody.appendChild(li);
});

function openList(){ listOverlay.hidden = false; }
function closeList(){ listOverlay.hidden = true; }

document.getElementById('listOpen').addEventListener('click', openList);
document.getElementById('listClose').addEventListener('click', closeList);
listOverlay.addEventListener('click', e => { if (e.target === listOverlay) closeList(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeList(); });

listBody.addEventListener('click', e => {
  const li = e.target.closest('li');
  if (!li) return;
  const target = Number(li.dataset.i);
  const at = order.indexOf(target);
  if (at > -1){
    setFlip(false);
    idx = at;
    render();
  }
  closeList();
});

render();
</script>
</body>
</html>
